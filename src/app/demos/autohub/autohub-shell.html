<header class="sticky top-0 z-40 border-b border-border bg-bg">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6">
    <a routerLink="/projects/autohub" class="flex items-center gap-2 text-lg font-black tracking-tight">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-accent text-accent-ink" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-2a2 2 0 0 1-4 0H9a2 2 0 0 1-4 0H3z"/></svg>
      </span>
      AutoHub
    </a>

    <nav aria-label="Раздел демо" class="flex items-center gap-1 text-sm">
      <a
        routerLink="/projects/autohub/cars"
        routerLinkActive="bg-surface-2 text-text"
        class="rounded-md px-3 py-2 text-muted hover:text-text"
      >Каталог</a>
      <a
        routerLink="/projects/autohub/favorites"
        routerLinkActive="bg-surface-2 text-text"
        class="flex items-center gap-2 rounded-md px-3 py-2 text-muted hover:text-text"
      >
        Избранное
        <span
          class="min-w-5 rounded-full bg-accent px-1.5 text-center text-xs font-semibold text-accent-ink"
          [attr.aria-label]="favorites.count() + ' в избранном'"
        >{{ favorites.count() }}</span>
      </a>
      <a routerLink="/projects" class="ml-2 hidden rounded-md border border-border px-3 py-2 text-muted hover:text-text sm:inline-block">
        ← Портфолио
      </a>
    </nav>
  </div>
</header>

<main id="main">
  <router-outlet />
</main>

<footer class="border-t border-border">
  <div class="mx-auto max-w-7xl space-y-4 px-4 py-6 text-xs text-muted sm:px-6">
    <p>Демо-проект. Автомобили, цены и продавцы вымышленные и не являются реальными объявлениями.</p>
    <app-photo-credits />
  </div>
</footer>
