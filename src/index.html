<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Портфолио веб-разработчика</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Портфолио веб-разработчика: интерактивные демо коммерческих сайтов.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('techbox:theme');
        var dark = saved === 'dark';
        document.documentElement.classList.toggle('theme-techbox-dark', dark);
        if (!dark) {
          document.documentElement.classList.add('theme-techbox');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
